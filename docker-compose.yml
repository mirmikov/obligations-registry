name: obligations-registry

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      TZ: Europe/Moscow
    volumes:
      - registry_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://registry:${POSTGRES_PASSWORD:-registry}@db:5432/registry?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Qazxsw21}
      RUN_DATABASE_MIGRATIONS: ${RUN_DATABASE_MIGRATIONS:-true}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chat_uploads:/data/chat_uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  registry_db:
  chat_uploads:
